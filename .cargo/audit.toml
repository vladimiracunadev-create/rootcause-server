# Exenciones de `cargo audit`, cada una con su razón y su comprobación.
#
# Una exención sin verificación es una excusa. La que sigue está respaldada por
# un paso de CI que falla si la premisa deja de ser cierta.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — ataque Marvin sobre `rsa`, sin versión corregida.
    #
    # `rsa` aparece en Cargo.lock porque el archivo de bloqueo conserva
    # dependencias opcionales de sqlx. Aquí nunca se compila: sqlx entra con
    # `default-features = false` y solo el driver `sqlite`; `rsa` cuelga del
    # driver MySQL, que no se activa en ningún objetivo. CI ejecuta
    # `cargo tree --all-features --target all --invert rsa` y falla si algún
    # día devuelve una cadena de dependencias.
    "RUSTSEC-2023-0071",
]
