version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Un lote por familia: revisar quince PR sueltos es cómo se termina
      # aprobando dependencias sin mirarlas.
      rust-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # sha2 0.11 es otra línea de la API de RustCrypto. Mientras sqlx siga en
      # 0.10, subir la dependencia directa no elimina el duplicado y sí cambia
      # el cálculo de huellas de integridad: se hará como decisión propia, no
      # como actualización automática.
      - dependency-name: sha2
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"
    ignore:
      # La etiqueta de la imagen de compilación sigue a rust-toolchain.toml a
      # propósito: se mueve cuando se mueve la MSRV, no antes.
      - dependency-name: rust
