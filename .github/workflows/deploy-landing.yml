name: Página del producto

# Publica `landing/` en GitHub Pages. Se despliega solo cuando esa carpeta
# cambia: la página del producto no debería republicarse porque alguien
# arregló un comentario en el motor de detección.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: La página no puede cargar recursos de otro origen
        run: |
          # Los enlaces a GitHub son navegación; lo que no puede existir es un
          # recurso (script, hoja de estilo, imagen, fuente) servido por terceros.
          if grep -rn 'src="http' landing --include='*.html'; then
            echo "::error::la página carga un recurso remoto con src"
            exit 1
          fi
          if grep -rnE '<link[^>]*href="http' landing --include='*.html'; then
            echo "::error::la página enlaza una hoja de estilo o fuente remota"
            exit 1
          fi
          if grep -rnE '@import|url\(http' landing --include='*.css'; then
            echo "::error::la hoja de estilo alcanza un origen externo"
            exit 1
          fi
          echo "la página es autocontenida"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
