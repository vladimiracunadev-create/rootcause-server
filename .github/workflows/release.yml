name: Publicación

# Un binario de defensa que no se puede verificar no sirve de nada. Cada
# artefacto sale con su suma SHA-256, su inventario de dependencias y una
# atestación de procedencia firmada por GitHub que ata el binario a este
# repositorio, a este commit y a este workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta a publicar, por ejemplo v0.2.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verificar antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: La versión de la etiqueta coincide con la del workspace
        env:
          REF_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          manifest="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="${REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::la etiqueta dice $tag y Cargo.toml dice $manifest"
            exit 1
          fi
          echo "versión verificada: $manifest"

  build:
    name: Construir ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Sin caché de compilación a propósito: un artefacto que se publica y se
    # firma no debe poder heredar nada de una caché envenenable.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            extension: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Compilar en perfil de distribución
        run: cargo build --profile dist --workspace --locked --target ${{ matrix.target }}

      - name: Empaquetar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          ARTIFACT: rootcause-${{ matrix.name }}
        run: |
          mkdir -p "dist/${ARTIFACT}"
          cp "target/${TARGET}/dist/rootcause-server${EXTENSION}" "dist/${ARTIFACT}/"
          cp "target/${TARGET}/dist/rootcause-agent${EXTENSION}" "dist/${ARTIFACT}/"
          cp README.md LICENSE SECURITY.md CHANGELOG.md .env.example "dist/${ARTIFACT}/"
          cp -r packaging "dist/${ARTIFACT}/packaging"
          cd dist
          tar -czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          else
            shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          fi
          cat "${ARTIFACT}.tar.gz.sha256"

      - name: Atestar la procedencia del artefacto
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/rootcause-${{ matrix.name }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootcause-${{ matrix.name }}
          path: |
            dist/rootcause-${{ matrix.name }}.tar.gz
            dist/rootcause-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publicar la versión
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.95.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefactos
          merge-multiple: true

      - name: Inventario de dependencias
        run: python3 scripts/sbom.py --output artefactos/sbom.cdx.json

      - name: Sumas de verificación consolidadas
        working-directory: artefactos
        run: |
          sha256sum ./*.tar.gz sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notas de la versión
        env:
          REF_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          {
            echo "## RootCause Server ${REF_NAME}"
            echo
            awk -v version="$version" '
              $0 ~ "^## \\[" version "\\]" { printing = 1; next }
              printing && /^## \[/ { exit }
              printing { print }
            ' CHANGELOG.md
            echo
            echo "### Verificar lo que descargaste"
            echo
            echo '```bash'
            echo "sha256sum --check SHA256SUMS.txt"
            echo "gh attestation verify rootcause-linux-x86_64.tar.gz --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > notas.md
          cat notas.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: RootCause Server ${{ github.event.inputs.version || github.ref_name }}
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          body_path: notas.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artefactos/*.tar.gz
            artefactos/*.sha256
            artefactos/SHA256SUMS.txt
            artefactos/sbom.cdx.json
