name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            extension: .exe
          - name: linux-x64
            os: ubuntu-latest
            extension: ""
          - name: macos-arm64
            os: macos-15
            extension: ""
          - name: macos-x64
            os: macos-15-intel
            extension: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: rootcause-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/rootcause-server${{ matrix.extension }}
            target/release/rootcause-agent${{ matrix.extension }}
            README.md
            LICENSE
