services:
  rootcause-server:
    build: .
    restart: unless-stopped
    environment:
      ROOTCAUSE_API_TOKEN: "${ROOTCAUSE_API_TOKEN:?Set ROOTCAUSE_API_TOKEN first}"
      ROOTCAUSE_BIND: "0.0.0.0:8080"
      ROOTCAUSE_DATABASE_URL: "sqlite:///var/lib/rootcause/rootcause.db"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - rootcause-data:/var/lib/rootcause
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rootcause-data:
